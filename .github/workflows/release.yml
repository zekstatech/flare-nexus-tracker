name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-2022
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download Electron
        run: node node_modules/electron/install.js

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish always

      - name: Hash app.asar and native addons
        run: node hash-asar.js "build-${{ runner.os }}.sha256"

      - name: Publish build hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node upload-build-hash.js "build-${{ runner.os }}.sha256"
